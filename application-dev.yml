# ====================================================================
# Application Development Environment Configuration (application-dev.yml)
# ====================================================================
# This configuration is loaded when the 'dev' profile is active.
# It defines local development settings, embedded/local database connections,
# debug logging, and devtools options.
# ====================================================================


server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: microservice-dev-app

  # Database Configuration (Local H2 or Local PostgreSQL/MySQL for Dev)
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  # H2 Console Configuration (Useful for local testing)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate Configuration for Development
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Cloud Config Client settings (if pulling from a Config Server)
  config:
    import: optional:configserver:http://localhost:8888

# Logging Configuration for Development (Verbose for debugging)
logging:
  level:
    root: INFO
    com.example.microservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Management / Actuator Endpoints for Health checks and metrics in dev
management:
  endpoints:
  - web:
      exposure:
        include: health,info,metrics,env,configprops
  endpoint:
  - health:
      show-details: ALWAYS
      # Custom Application Properties for Dev
app:
  feature:
    new-dashboard: true
  welcome-message: "Welcome to the Development Environment!"
  timeout: 5000

# ====================================================================
# Fault Tolerance Configuration (Resilience4j)
# ====================================================================
resilience4j:
  circuitbreaker:
    instances:
      defaultService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50             # Open circuit if 50% of calls fail
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s        # Consider call slow if > 2 seconds
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s         # Wait 10s before trying recovery
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      defaultService:
        maxAttempts: 3                       # Retry failed call up to 3 times
        waitDuration: 2s                     # Wait 2 seconds between retries
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

  timelimiter:
    instances:
      defaultService:
        timeoutDuration: 3s                  # Timeout if call takes longer than 3 seconds
        cancelRunningFuture: true


spring:
  datasource:
    hikari:
      maximum-pool-size: 10                  # Max connections in the pool for dev
      minimum-idle: 5                        # Minimum idle connections maintained
      connection-timeout: 30000              # Maximum milliseconds to wait for a connection (30s)
      idle-timeout: 600000                   # Time an idle connection can sit before being removed (10m)
      max-lifetime: 1800000                  # Maximum lifetime of a connection (30m)

management:
  endpoint:
    health:
      probes:
        enabled: true                        # Enables Liveness and Readiness probes
      show-details: ALWAYS
  health:
    circuitbreakers:
      enabled: true                          # Show Circuit Breaker status in /actuator/health
    db:
      enabled: true                          # Monitor database health status
